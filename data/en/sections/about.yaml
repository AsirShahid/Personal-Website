summary: 'I am an engineer-turned-physician with a BS in Mathematics & Applied Mathematics and Statistics from Stony Brook University. After several years working in data science and automation engineering, I left my career in tech to pursue medicine. I spent the last three years completing my pre-medical prerequisites at Stony Brook — earning straight As across biology, chemistry, organic chemistry, biochemistry, physics, and anatomy — and I will be starting the 3-Year MD Program with a Radiology Pathway at the Renaissance School of Medicine at Stony Brook University in July 2026. My background in quantitative analysis, data, and engineering directly informs my interest in radiology and medical imaging.'

